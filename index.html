<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="info">
      <img class="info__image" src="./eisenhower-matrix.jpg" alt="Eisenhower-matrix image" />
      <a class="info__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="todo">
      <div id="add-task-section" class="todo__add">
        <label class="todo__label" for="new-task">Add Item</label>
        <div class="todo__row">
          <input id="new-task" class="todo__input" type="text" />
          <button class="todo__add-btn">Add</button>
        </div>
      </div>
      <h3 class="todo__section-title">Todo</h3>
      <ul id="incomplete-tasks" class="task-list task-list--incomplete">
        <li class="task">
          <input class="task__checkbox" type="checkbox" />
          <label class="task__label">Pay Bills</label>
          <input class="task__text" type="text" />
          <button class="task__btn task__btn--edit">Edit</button>
          <button class="task__btn task__btn--delete">
            <img class="task__icon" src="./remove.svg" alt="remove icon" />
          </button>
        </li>
        <li class="task task--editing">
          <input class="task__checkbox" type="checkbox" />
          <label class="task__label">Go Shopping</label>
          <input class="task__text" type="text" value="Go Shopping" />
          <button class="task__btn task__btn--edit">Save</button>
          <button class="task__btn task__btn--delete"> 
            <img class="task__icon" src="./remove.svg" alt="remove icon" />
          </button>
        </li>
      </ul>
      <h3 class="todo__section-title">Completed</h3>
      <ul  id="completed-tasks" class="task-list task-list--completed">
        <li class="task">
          <input class="task__checkbox" type="checkbox" checked />
          <label class="task__label">See the Doctor</label>
          <input class="task__text" type="text" />
          <button class="task__btn task__btn--edit">Edit</button>
          <button class="task__btn task__btn--delete">
            <img class="task__icon"  src="./remove.svg" alt="remove icon" />
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
