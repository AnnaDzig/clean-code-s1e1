<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="info">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower-matrix image" />
      <a class="info__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="todo">
      <div id="add-task-section">
        <label for="new-task">Add Item</label>
        <div class="todo__row">
          <input id="new-task" class="todo__input" type="text" />
          <button>Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox" />
          <label class="todo__input">Pay Bills</label>
          <input type="text" class="task" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" alt="remove icon" /></button>
        </li>
        <li class="editMode">
          <input type="checkbox" />
          <label class="task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="todo__input" />
          <button class="edit">Save</button>
          <button class="delete"> <img src="./remove.svg" alt="remove icon" /></button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked />
          <label class="todo__input">See the Doctor</label>
          <input type="text" class="todo__input" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" alt="remove icon" /></button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
